name: Deploy DevOps Training Website

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Debug OIDC token
        uses: github/actions-oidc-debugger@main
        continue-on-error: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::825794241247:role/github-actions-devops-training
          aws-region: eu-north-1

      - name: Deploy website to S3
        run: |
          aws s3 sync . s3://devops-training-cicd-825794241247 \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*"
